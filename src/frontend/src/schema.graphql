schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  inventoryItemById(id: ID!): InventoryItem @cost(weight: "10")
  node(id: ID!): Node
  orderById(id: ID!): Order @cost(weight: "10")
  paymentById(id: ID!): Payment @cost(weight: "10")
  productById(id: ID!): Product @cost(weight: "10")
  products(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
    maxPrice: Float
    minPrice: Float
    searchText: String
  ): ProductsConnection @cost(weight: "10")
  promotionById(id: ID!): Promotion @cost(weight: "10")
  "Fetches the currently running promotions."
  promotions: [Promotion!]! @cost(weight: "10")
  recommendationById(id: ID!): Recommendation @cost(weight: "10")
  recommendations: [Recommendation!]! @cost(weight: "10")
  reviewById(id: ID!): Review @cost(weight: "10")
  userById(id: ID!): User @cost(weight: "10")
  userByUsername(username: String!): User @cost(weight: "10")
  users(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
  ): UsersConnection @cost(weight: "10")
  viewer: Viewer!
}

type Mutation {
  addProductToCart(input: AddProductToCartInput!): AddProductToCartPayload!
    @cost(weight: "10")
  "Applies a promo code to a cart, replacing any code already applied."
  applyPromoCode(input: ApplyPromoCodeInput!): ApplyPromoCodePayload!
  checkout: CheckoutPayload! @cost(weight: "10")
  createOrder(input: CreateOrderInput!): CreateOrderPayload! @cost(weight: "10")
  createPayment(input: CreatePaymentInput!): CreatePaymentPayload!
    @cost(weight: "10")
  createPromoCode(input: CreatePromoCodeInput!): CreatePromoCodePayload!
  "Creates a new promotion that products across the catalog can take part in."
  createPromotion(input: CreatePromotionInput!): CreatePromotionPayload!
    @cost(weight: "10")
  createReview(input: CreateReviewInput!): CreateReviewPayload!
    @cost(weight: "10")
  removeProductFromCart(input: RemoveProductFromCartInput!): RemoveProductFromCartPayload!
    @cost(weight: "10")
  "Removes the promo code currently applied to a cart, if any."
  removePromoCode(input: RemovePromoCodeInput!): RemovePromoCodePayload!
  restockProduct(input: RestockProductInput!): RestockProductPayload!
    @cost(weight: "10")
  uploadProductPicture(input: UploadProductPictureInput!): UploadProductPicturePayload!
    @cost(weight: "10")
}

type Subscription {
  onReviewCreated(after: String): ReviewCreated!
}

type AddProductToCartPayload {
  cart: Cart
  errors: [AddProductToCartError!]
}

type ApplyPromoCodePayload {
  cart: Cart
  errors: [ApplyPromoCodeError!]
}

type Cart {
  createdAt: DateTime!
  id: ID!
  items(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
  ): CartItemsConnection @cost(weight: "10")
  "The promo code currently applied to this cart, if any."
  promoCode: PromoCode @cost(weight: "10")
}

type CartIsEmptyError implements Error {
  message: String!
}

type CartItem {
  addedAt: DateTime!
  id: ID!
  lineTotal: Float!
  product: Product!
  quantity: Int!
  unitPrice: Float!
}

"A connection to a list of items."
type CartItemsConnection {
  "A list of edges."
  edges: [CartItemsEdge!]
  "A flattened list of the nodes."
  nodes: [CartItem!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
}

"An edge in a connection."
type CartItemsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: CartItem!
}

type CheckoutPayload {
  cart: Cart
  errors: [CheckoutError!]
}

type CreateOrderPayload {
  order: Order
}

type CreatePaymentPayload {
  payment: Payment
}

type CreatePromoCodePayload {
  errors: [CreatePromoCodeError!]
  promoCode: PromoCode
}

type CreatePromotionPayload {
  promotion: Promotion
}

type CreateReviewPayload {
  review: Review
}

type InvalidDiscountPercentError implements Error {
  discountPercent: Int!
  message: String!
}

type InvalidPromoCodeFormatError implements Error {
  code: String!
  message: String!
}

type InventoryItem implements Node {
  id: ID!
  product: Product!
  quantity: Int!
}

type NoPromoCodeAppliedError implements Error {
  message: String!
}

type Order implements Node {
  id: ID!
  items: [OrderItem!]!
  payments: [Payment!]! @cost(weight: "10")
  user: User!
  weight: Int!
}

type OrderItem {
  id: Int!
  order: Order
  orderId: Int!
  price: Float!
  product: Product!
  quantity: Int!
}

"Information about pagination in a connection."
type PageInfo {
  "When paginating forwards, the cursor to continue."
  endCursor: String
  "Indicates whether more edges exist following the set defined by the clients arguments."
  hasNextPage: Boolean!
  "Indicates whether more edges exist prior the set defined by the clients arguments."
  hasPreviousPage: Boolean!
  "When paginating backwards, the cursor to continue."
  startCursor: String
}

type Payment implements Node {
  amount: Decimal!
  createdAt: DateTime!
  id: ID!
  order: Order!
  status: PaymentStatus!
}

type Product implements Node {
  deliveryEstimate(zip: String!): Int!
  dimension: ProductDimension!
  "The list price after applying the discount of the current promotion."
  discountedPrice: Float! @cost(weight: "10")
  error: Int!
  id: ID!
  item: InventoryItem @cost(weight: "10")
  name: String!
  pictureFileName: String
  pictureUrl: URI
  price: Float!
  "The promotion this product currently takes part in, if any."
  promotion: Promotion @cost(weight: "10")
  quantity: Int! @cost(weight: "10")
  recommendation: Recommendation @cost(weight: "10")
  reviews(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
  ): ProductReviewsConnection @cost(weight: "10")
  weight: Int!
}

type ProductAmountCannotBeLowerThanOneError implements Error {
  message: String!
}

type ProductDimension {
  height: Float!
  length: Float!
  width: Float!
}

"A connection to a list of items."
type ProductReviewsConnection {
  "A list of edges."
  edges: [ProductReviewsEdge!]
  "A flattened list of the nodes."
  nodes: [Review!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
}

"An edge in a connection."
type ProductReviewsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Review!
}

"A connection to a list of items."
type ProductsConnection {
  "A list of edges."
  edges: [ProductsEdge!]
  "A flattened list of the nodes."
  nodes: [Product!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
}

"An edge in a connection."
type ProductsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Product!
}

type PromoCode {
  code: String!
  discountPercent: Int!
  expiresAt: DateTime
  id: ID!
  isExpired: Boolean!
  title: String!
}

type PromoCodeAlreadyExistsError implements Error {
  code: String!
  message: String!
}

type PromoCodeExpiredError implements Error {
  code: String!
  expiresAt: DateTime!
  message: String!
}

type PromoCodeNotFoundError implements Error {
  code: String!
  message: String!
}

"A discount campaign that products across the catalog take part in."
type Promotion {
  description: String
  "The discount in percent that the promotion takes off the list price."
  discountPercent: Int!
  id: ID!
  title: String!
}

type Recommendation implements Node {
  id: ID!
  product: Product!
  reason: String!
  score: Float!
  user: User!
}

type RemoveProductFromCartPayload {
  cart: Cart
  errors: [RemoveProductFromCartError!]
}

type RemovePromoCodePayload {
  cart: Cart
  errors: [RemovePromoCodeError!]
}

type RestockProductPayload {
  product: Product
}

type Review implements Node {
  author: User @cost(weight: "10")
  body: String!
  createAt: DateTime!
  id: ID!
  product: Product!
  stars: Int!
}

type ReviewCreated {
  cursor: String!
  review: Review!
}

type UnknownProductError implements Error {
  message: String!
  productId: Int!
}

type UploadProductPicturePayload {
  errors: [UploadProductPictureError!]
  product: Product
}

type User implements Node {
  birthdate: DateTime!
  id: ID!
  name: String!
  recommendations: [Recommendation!]! @cost(weight: "10")
  reviews(
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the elements in the list that come before the specified cursor."
    before: String
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the last _n_ elements from the list."
    last: Int
  ): UserReviewsConnection @cost(weight: "10")
  username: String!
}

"A connection to a list of items."
type UserReviewsConnection {
  "A list of edges."
  edges: [UserReviewsEdge!]
  "A flattened list of the nodes."
  nodes: [Review!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
}

"An edge in a connection."
type UserReviewsEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: Review!
}

"A connection to a list of items."
type UsersConnection {
  "A list of edges."
  edges: [UsersEdge!]
  "A flattened list of the nodes."
  nodes: [User!]
  "Information to aid in pagination."
  pageInfo: PageInfo!
}

"An edge in a connection."
type UsersEdge {
  "A cursor for use in pagination."
  cursor: String!
  "The item at the end of the edge."
  node: User!
}

type Viewer {
  cart: Cart! @cost(weight: "10")
}

interface Error {
  message: String!
}

"The node interface is implemented by entities that have a global unique identifier."
interface Node {
  id: ID!
}

union AddProductToCartError = ProductAmountCannotBeLowerThanOneError

union ApplyPromoCodeError = PromoCodeNotFoundError | PromoCodeExpiredError

union CheckoutError = CartIsEmptyError

union CreatePromoCodeError =
  | PromoCodeAlreadyExistsError
  | InvalidDiscountPercentError
  | InvalidPromoCodeFormatError

union RemoveProductFromCartError = ProductAmountCannotBeLowerThanOneError

union RemovePromoCodeError = NoPromoCodeAppliedError

union UploadProductPictureError = UnknownProductError

input AddProductToCartInput {
  productId: ID!
  quantity: Int!
}

input ApplyPromoCodeInput {
  cartId: ID!
  code: String!
}

input CreateOrderInput {
  items: [OrderItemInput!]!
  userId: ID!
  weight: Int!
}

input CreatePaymentInput {
  orderId: ID!
}

input CreatePromoCodeInput {
  code: String!
  discountPercent: Int!
  expiresAt: DateTime
  title: String!
}

input CreatePromotionInput {
  description: String
  "The discount in percent that the promotion takes off the list price."
  discountPercent: Int!
  title: String!
}

input CreateReviewInput {
  authorId: ID!
  body: String!
  productId: ID!
  stars: Int!
}

input OrderItemInput {
  price: Float!
  productId: ID!
  quantity: Int!
}

input ProductDimensionInput {
  height: Float!
  length: Float!
  weight: Int!
  width: Float!
}

input RemoveProductFromCartInput {
  productId: ID!
  quantity: Int!
}

input RemovePromoCodeInput {
  cartId: ID!
}

input RestockProductInput {
  id: ID!
  quantity: Int!
}

input UploadProductPictureInput {
  picture: Upload!
  productId: Int!
}

enum PaymentStatus {
  PENDING
  AUTHORIZED
  DECLINED
  REFUNDED
}

enum ScalarSerializationType {
  STRING
  BOOLEAN
  INT
  FLOAT
  OBJECT
  LIST
}

"The `DateTime` scalar type represents a date and time with time zone offset information."
scalar DateTime
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/date-time.html")

"The `Decimal` scalar type represents a decimal floating-point number with high precision."
scalar Decimal
  @specifiedBy(url: "https://scalars.graphql.org/chillicream/decimal.html")

"The `Upload` scalar type represents a file upload."
scalar Upload

"The `URI` scalar type represents a Uniform Resource Identifier (URI) as defined by RFC 3986."
scalar URI @specifiedBy(url: "https://scalars.graphql.org/chillicream/uri.html")

directive @cost(weight: String!) on
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | ENUM
  | INPUT_FIELD_DEFINITION

directive @defer(if: Boolean = true, label: String) on
  | FRAGMENT_SPREAD
  | INLINE_FRAGMENT

directive @tag(name: String!) repeatable on
  | SCHEMA
  | SCALAR
  | OBJECT
  | FIELD_DEFINITION
  | ARGUMENT_DEFINITION
  | INTERFACE
  | UNION
  | ENUM
  | ENUM_VALUE
  | INPUT_OBJECT
  | INPUT_FIELD_DEFINITION
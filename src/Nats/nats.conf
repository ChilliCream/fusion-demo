server_name: "demo-nats"

# App Service only exposes the WebSocket listener below. Keep the regular
# NATS TCP listener available locally for container-level diagnostics.
listen: "127.0.0.1:4222"

authorization {
  token: $NATS_TOKEN
}

jetstream {
  # /home is persisted when WEBSITES_ENABLE_APP_SERVICE_STORAGE=true.
  store_dir: "/home/nats/jetstream"

  # Keep this demo instance bounded so it cannot consume the App Service
  # plan's shared storage or memory indefinitely.
  max_file_store: 1GB
  max_memory_store: 256MB
}

websocket {
  host: "0.0.0.0"
  port: 8080

  # Azure App Service terminates TLS at its front end. Clients still connect
  # securely with wss://; traffic forwarded to this container is plain WS.
  no_tls: true
}
